# LOCAL PROBE: the pipeline's `annotate` (and `interpret`) on a model served on this machine through the openai_compat
# provider (mlx_vlm.server, an mlx-community 4-bit conversion), on P3's spans, one cold run each. No API cost; the
# measure is seconds per call, tokens, JSON validity, and the labels beside the API model's (docs/results/p3, p10).
# The model is the base config's [model]: `evals/local-scry.toml`, a copy of scry.toml pointing at the local server.
phase = "local-probe"
source = "runs/p0"
base_config = "evals/local-scry.toml"
stages = ["read", "track", "annotate"]
repeats = 1

[spans.smoke]
frames = "145-155"

[axis.model.q8b]
"model.model" = "mlx-community/Qwen3-VL-8B-Instruct-4bit"
"model.base_url" = "http://127.0.0.1:8080/v1"
"annotate.mode" = "incremental"
"annotate.transcribe" = true
"annotate.reference" = "ids"
"annotate.scale" = 1.0

[axis.model.q27b]
"model.model" = "mlx-community/Qwen3.8-27B-4bit"
"model.base_url" = "http://127.0.0.1:8081/v1"
"annotate.mode" = "incremental"
"annotate.transcribe" = true
"annotate.reference" = "ids"
"annotate.scale" = 1.0
