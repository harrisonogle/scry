# LOCAL3 FULL: the whole hold-out session (all 80 frames of runs/v2/grouponly-100) on the local 27B at the fair
# settings (temperature 0 through proxy.py, the schema's field descriptions in the system prompt, concurrency 1,
# group-only), annotate, interpret, summarize and index. Same phase directory as the 22-frame span run.
phase = "local3"
source = "runs/v2/grouponly-100"
base_config = "<scratch>/local3/local3-scry.toml"
stages = ["read", "track", "annotate", "interpret", "summarize", "index"]
repeats = 1

[spans.full]
frames = "0-79"

[axis.variant.L1]
"model.model" = "mlx-community/Qwen3.8-27B-4bit"
"model.base_url" = "http://127.0.0.1:8091/v1"
