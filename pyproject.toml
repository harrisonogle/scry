[project]
name = "scry"
version = "0.1.0"
description = "Visual transcript pipeline for silent screen-recording tutorials"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "av>=14",
  "pillow>=11",
  "rapidfuzz>=3.9",
  "anthropic>=1.5",
  "pydantic>=2.8",
  "sqlite-vec>=0.1.6",
  "typer>=0.12",
  "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
rapid = ["rapidocr-onnxruntime>=1.3"]
embed = ["fastembed>=0.3"]
outline = ["google-genai>=1.0"]

[project.scripts]
scry = "scry.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
