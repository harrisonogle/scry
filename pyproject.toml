[project]
name = "scry"
version = "0.1.0"
description = "Visual transcript pipeline for silent screen-recording tutorials"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "av>=14",
  "pillow>=11",
  "rapidfuzz>=3.9",
  "anthropic>=1.5",
  "pydantic>=2.8",
  "sqlite-vec>=0.1.6",
  "typer>=0.12",
  "rapidocr>=3.9",
  "onnxruntime>=1.20",
  "mcp>=2.2.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
outline = ["google-genai>=2.23"]  # 2.23.0 is the version the agentic interactions call was verified with

[project.scripts]
scry = "scry.cli:app"
scry-mcp = "scry.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
